services:
  - type: web
    name: ai-citizen-grievance-assistant
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --prefix server && npm ci --include=dev --prefix client && npm run build --prefix server && npm run build --prefix client
    startCommand: npm run db:migrate --prefix server && npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: UPLOAD_DIR
        value: uploads
      - key: SLA_HIGH_HOURS
        value: "24"
      - key: SLA_MEDIUM_HOURS
        value: "72"
      - key: SLA_LOW_HOURS
        value: "120"
