name: CivicConnect CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck, tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Compile backend
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  frontend:
    name: Frontend production build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
